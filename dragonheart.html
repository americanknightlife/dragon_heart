<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Dragon's Heart – The 90-Day Vigil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --gold: #fbbf24;
            --blue: #38bdf8;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: #f1f5f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-wrapper {
            width: 95%;
            max-width: 500px;
            background: var(--card);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.2rem; font-weight: bold; display: block; margin-top: 5px; }

        /* Egg Visualization */
        #egg-container {
            margin: 40px 0;
            position: relative;
        }

        .egg-svg {
            width: 180px;
            filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.2));
            transition: all 0.5s ease;
        }

        .pulse { animation: pulse 3s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* Input Styles */
        #thoughtInput {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-primary { background: var(--blue); color: white; }
        .btn-save { background: transparent; color: var(--blue); border: 1px solid var(--blue); margin-top: 20px;}
        
        .hatch-btn { 
            background: linear-gradient(to right, #f59e0b, #ef4444); 
            color: white; font-size: 1.2rem; animation: glow 2s infinite;
        }

        @keyframes glow { 0%, 100% { box-shadow: 0 0 5px var(--gold); } 50% { box-shadow: 0 0 20px var(--gold); } }

        .hidden { display: none; }
        .warning { color: var(--danger); font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <h2 id="story-title">The 90-Day Vigil</h2>
    <p style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px;">The dragon will hatch when the time is right, provided it is loved.</p>

    <div class="stats-grid">
        <div class="stat-box">
            <span class="stat-label">Egg Health</span>
            <span class="stat-value" id="healthVal">100%</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Days Remaining</span>
            <span class="stat-value" id="daysVal">90</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Weekly Whispers</span>
            <span class="stat-value" id="weeklyVal">0 / 7</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Total Love</span>
            <span class="stat-value" id="loveVal">0</span>
        </div>
    </div>

    <div id="egg-container">
        <svg class="egg-svg pulse" viewBox="0 0 200 260">
            <ellipse id="eggShape" cx="100" cy="130" rx="90" ry="120" fill="#475569" />
        </svg>
    </div>

    <!-- HATCH BUTTON (Hidden until 90 days pass) -->
    <button id="hatchBtn" class="btn hatch-btn hidden" onclick="location.href='baby_dragon.html'">✨ THE EGG IS HATCHING! ENTER ✨</button>

    <div id="input-ui">
        <input type="text" id="thoughtInput" placeholder="Whisper something positive...">
        <button class="btn btn-primary" onclick="feedEgg()">Channel Positivity</button>
        <p id="weeklyWarning" class="warning hidden">Goal met for this week! Keep going or rest.</p>
    </div>

    <button class="btn btn-save" onclick="exportSoul()">Save Dragon Soul (.json)</button>
    <input type="file" id="importFile" class="hidden" onchange="importSoul(event)">
    <p style="font-size: 0.7rem; color: #64748b; cursor: pointer; margin-top: 10px;" onclick="document.getElementById('importFile').click()">Load Existing Soul</p>
</div>

<script>
    // Configuration
    const GOAL_PER_WEEK = 7;
    const DAYS_TO_HATCH = 90;
    const MS_IN_DAY = 86400000;
    const MS_IN_WEEK = MS_IN_DAY * 7;

    // Game State
    let soul = {
        createdDate: Date.now(),
        lastCheckIn: Date.now(),
        health: 100,
        totalLove: 0,
        weeklyCount: 0
    };

    function init() {
        // Load from LocalStorage if it exists
        const saved = localStorage.getItem('dragon_soul');
        if (saved) {
            soul = JSON.parse(saved);
        }
        checkTimePassage();
        updateUI();
    }

    function checkTimePassage() {
        const now = Date.now();
        const timeDiff = now - soul.lastCheckIn;

        // If more than a week has passed since the last count reset
        if (timeDiff >= MS_IN_WEEK) {
            const weeksPassed = Math.floor(timeDiff / MS_IN_WEEK);
            
            for(let i = 0; i < weeksPassed; i++) {
                if (soul.weeklyCount < GOAL_PER_WEEK) {
                    soul.health = Math.max(0, soul.health - 20); // Penalty for missing a week
                }
                soul.weeklyCount = 0; // Reset count for the new week
            }
            soul.lastCheckIn = now;
            save();
        }
    }

    function feedEgg() {
        const input = document.getElementById('thoughtInput');
        if (!input.value.trim()) return;

        soul.totalLove++;
        soul.weeklyCount++;
        input.value = '';
        
        save();
        updateUI();

        // Small visual feedback
        const egg = document.getElementById('eggShape');
        egg.style.fill = "#38bdf8";
        setTimeout(() => updateUI(), 500);
    }

    function updateUI() {
        const now = Date.now();
        const ageInMs = now - soul.createdDate;
        const daysPassed = Math.floor(ageInMs / MS_IN_DAY);
        const daysLeft = Math.max(0, DAYS_TO_HATCH - daysPassed);

        document.getElementById('healthVal').textContent = soul.health + "%";
        document.getElementById('daysVal').textContent = daysLeft;
        document.getElementById('weeklyVal').textContent = `${soul.weeklyCount} / ${GOAL_PER_WEEK}`;
        document.getElementById('loveVal').textContent = soul.totalLove;

        // Color the egg based on health/love
        const eggShape = document.getElementById('eggShape');
        if (soul.health < 50) eggShape.setAttribute('fill', '#991b1b');
        else eggShape.setAttribute('fill', interpolateColor(soul.totalLove / 100));

        // Weekly Warning
        const warning = document.getElementById('weeklyWarning');
        if (soul.weeklyCount >= GOAL_PER_WEEK) warning.classList.remove('hidden');
        else warning.classList.add('hidden');

        // Hatching Condition
        if (daysLeft === 0 && soul.health > 0) {
            document.getElementById('input-ui').classList.add('hidden');
            document.getElementById('hatchBtn').classList.remove('hidden');
            document.getElementById('story-title').textContent = "The Time is Now";
        }
        
        if (soul.health <= 0) {
            document.getElementById('story-title').textContent = "The Soul has Faded";
            document.getElementById('input-ui').classList.add('hidden');
        }
    }

    function interpolateColor(p) {
        // Shifts from slate-grey to magical-blue
        const r = Math.round(71 + (56 - 71) * Math.min(p, 1));
        const g = Math.round(85 + (189 - 85) * Math.min(p, 1));
        const b = Math.round(105 + (248 - 105) * Math.min(p, 1));
        return `rgb(${r},${g},${b})`;
    }

    function save() {
        localStorage.setItem('dragon_soul', JSON.stringify(soul));
    }

    function exportSoul() {
        const data = JSON.stringify(soul, null, 2);
        const blob = new Blob([data], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `dragon_soul_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function importSoul(event) {
        const reader = new FileReader();
        reader.onload = (e) => {
            soul = JSON.parse(e.target.result);
            save();
            updateUI();
            alert("Dragon Soul Bound Successfully.");
        };
        reader.readAsText(event.target.files[0]);
    }

    init();
</script>
</body>
</html>
